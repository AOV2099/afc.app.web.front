services:
  afc-front:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - PUBLIC_GOOGLE_CLIENT_ID=${PUBLIC_GOOGLE_CLIENT_ID:-}
      - PUBLIC_GOOGLE_AUTH_MODE=${PUBLIC_GOOGLE_AUTH_MODE:-direct}
      - AFC_BACKEND_URL=${AFC_BACKEND_URL:-http://afc-back:3000}
    restart: unless-stopped
    # Descomentar si necesitas variables de entorno personalizadas
    # env_file:
    #   - .env.production
